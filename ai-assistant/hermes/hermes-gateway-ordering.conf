# systemd drop-in for hermes-gateway.service (net effect: "10-" prefix ordering)
#
# WHY A DROP-IN AND NOT AN EDIT TO THE UNIT: `hermes gateway install` regenerates
# hermes-gateway.service, so changes made directly to it would be lost on the next
# install or update. A drop-in is preserved.
#
# WHY THIS ORDERING: the gateway starts the kanban dispatcher, which spawns workers
# that call llama-server on :58000, and it launches laya-mcp-server as a child.
# Without this it starts in parallel with both, so after a reboot the first workers
# can fail against a model server that is not listening yet.
#
# After= only orders *start* (both are Type=simple, so "active" means the process is
# running, not that it is serving). That is enough: llama-server binds its port
# immediately and loads models on demand, and the gateway retries.
[Unit]
After=llamacpp-daemon.service
Wants=llamacpp-daemon.service
