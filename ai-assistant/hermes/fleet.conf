# fleet.conf — the single source of truth for the agent fleet's configuration.
#
# Sourced by fleet-apply.sh. Change values HERE, never per profile: the whole
# point is that the main config and all eight profile configs are written from
# this one file, so they cannot drift.
#
# Why this exists: before it, every setting was 8 separate `hermes config set`
# calls. 8 x ~123 KB of duplicated YAML had already reached 4 distinct file
# sizes, and a change applied to 7 of 8 profiles fails silently and looks like
# an inexplicable behavioural difference days later.
#
# Apply with:  ./fleet-apply.sh [--dry-run]

# ── Hardware mode ────────────────────────────────────────────────────────────
# auto   — derive from the GPU count at apply time (default)
# queue  — force single-GPU serialisation
# fleet  — force multi-GPU fan-out
#
# What actually differs:
#
#   queue (1 GPU)                 fleet (N GPUs)
#   ─────────────────────────     ──────────────────────────────
#   max_in_progress 1             max_in_progress N
#   llama --parallel 1            llama --parallel 2 per GPU
#   1 resident model              1 model server per GPU
#   review costs double the       review is cheap because it runs
#     serialised GPU time           on a different device
#   fan-out is a queue            fan-out is genuine parallelism
#
# So the *architecture* is identical either way; only the concurrency budget
# moves. Queue mode is not a degraded fleet — it is the same system honestly
# reporting that it has one worker.
FLEET_MODE="auto"

# ── Concurrency budget per mode ──────────────────────────────────────────────
QUEUE_MAX_IN_PROGRESS=1
FLEET_MAX_IN_PROGRESS=""          # empty = one per GPU, derived at apply time

QUEUE_LLAMA_PARALLEL=1
FLEET_LLAMA_PARALLEL=2            # slots per GPU in fleet mode

# ── Model / context ──────────────────────────────────────────────────────────
MODEL_PROVIDER="llamacpp"
MODEL_DEFAULT="qwen3.6-30b-a3b"
# Must be <= llama-server's --ctx-size DIVIDED BY --parallel. Telling Hermes the
# window is 64k while the server hands it 16k is what made sessions die before
# compaction could fire.
MODEL_CONTEXT_LENGTH=65536
MODEL_API_KEY="none"
DETECT_PORTS="[58000]"

# ── Compression ──────────────────────────────────────────────────────────────
COMPRESSION_MAX_ATTEMPTS=6
COMPRESSION_PROGRESS_NOTICES="true"

# Absolute compaction trigger, in input tokens. 0 = off (ratio-only).
#
# WHY AN ABSOLUTE CAP AND NOT THE RATIO: `compression.threshold` is floored at
# 0.75 for any window under 512K, so on this 65536-token window the ratio trigger
# is 49152 — compaction could not fire until a session was already 49k tokens.
# Measured 2026-10-18: the orchestrator's Telegram session reached 45,694 tokens.
#
# On this box prefill runs 335-357 tok/s cool but 49-80 tok/s once the package is
# heat-soaked (four to seven times slower — see Thermals below), so a 49k prompt is
# 2.5 min cold and 10-16 min hot. Hermes abandons a stream that has produced no
# bytes for `agent.local_stream_stale_timeout` (default 900s), and the cross-turn
# stale breaker (HERMES_STREAM_STALE_GIVEUP, 5) then latches that session into a
# permanent fail-fast state. A big prompt is therefore not slow, it is fatal.
#
# 40000, NOT lower. The fixed overhead eats most of the window before any
# conversation exists - measured 2026-10-18: a fresh orchestrator turn sent
# 23,871 input tokens and a fresh designer worker 27,988 (system prompt + skills
# + tool schemas, of which tool_search alone defers ~8k). A trigger below that
# floor cannot be satisfied by compaction, so the turn burns 6 rounds of
# summarisation and then fails with "max compression attempts reached".
# 40000 leaves the designer ~12k of real conversation, cuts the observed worst
# case (45,694) and keeps a heat-soaked prefill near 8 min, inside the stale
# grace below. The next lever is the floor itself: pass fewer skills/toolsets
# per card (kanban create --skill ...), not a lower number here.
COMPRESSION_THRESHOLD_TOKENS=40000

# ── Thermals ─────────────────────────────────────────────────────────────────
# This chassis has no sustained-inference headroom: closed-lid airflow is the
# binding constraint, not VRAM. Under load the package sits at 82-100 C with the
# fan past its rated 3300 RPM, and the EC then squeezes the dGPU from 35 W to
# 20 W / ~330 MHz. Measured 2026-10-18, same process and same model load:
#
#   cool (pkg 66 C)   prefill 335-357 tok/s
#   heat-soaked       prefill  49- 80 tok/s
#
# Nothing in userspace fixes that. What userspace can do is not queue a request
# behind a 40-minute generation, so the local stale grace is raised from its
# 900s default and long generations are capped in the model preset (`n-predict`).
LOCAL_STREAM_STALE_TIMEOUT=1800

# ── Auxiliary timeouts ───────────────────────────────────────────────────────
# These run on the same local model. A cold 30B load plus generation does not
# fit in the 60s default, and queue mode makes them wait behind main generation.
AUX_TIMEOUT=300

# Background self-improvement review: a post-turn fork that replays the whole
# conversation through the MAIN model to patch skills. It is invisible on the
# kanban board, but it holds the single GPU slot for its whole duration — on this
# laptop that pins the package at 100 °C with the fan running past its rated max.
# Uncapped, the review replays the conversation on every tool iteration it makes,
# so one review multiplies input tokens without limit (unset = unlimited).
#
# Capped rather than disabled, and the cap MATTERS: the default is
# 0.75 x context_length (49,152 here), which is ~11 minutes of 100% GPU per review
# at the ~76 tok/s this box manages on a 50k prompt.
# 48000 is Hermes' own documented example. To switch them off entirely, set
# `auxiliary.background_review.enabled = false`.
BACKGROUND_REVIEW_MAX_INPUT_TOKENS=16000

# ── Kanban ───────────────────────────────────────────────────────────────────
KANBAN_ORCHESTRATOR_PROFILE="orchestrator"
KANBAN_FAILURE_LIMIT=2
KANBAN_AUTO_DECOMPOSE="true"

# Human-only review lane. `true` (the upstream default) spawns a fresh agent run
# on the SAME profile, same skills, same model, to review work that profile just
# wrote. On a one-GPU box that is not a second opinion, it is the same opinion at
# double the price - and it does not judge, it redoes: measured on t_c58bc0d2
# (2026-10-19), both 2-hour runs on that card were review-lane runs, "review"
# rewrote the same 6 KB deck instead of judging it, and the deck it kept
# endorsing was in English with reveal.js loaded from a CDN. `request_review`
# still parks the card in `review` and the Telegram notifier still wakes on
# `review_requested`, so the reviewer is the human, who is notified. Re-enable
# only with a model better than the author (i.e. not this laptop).
KANBAN_REVIEW_DISPATCH="false"

# Per-task wall-clock cap, enforced by the dispatcher (SIGTERM then SIGKILL,
# emits `timed_out`). NOTHING sets this column by default, so without a value
# here the terminator never fires and a worker runs until it is manually
# stopped — one did, for 4h36m, holding the only GPU slot. Generous rather
# than tight: it exists to stop runaways, not to hurry real work. 0 disables.
KANBAN_DEFAULT_MAX_RUNTIME=7200

# ── Hooks ────────────────────────────────────────────────────────────────────
# Required for shell hooks to register non-interactively.
HOOKS_AUTO_ACCEPT="true"

# ── Skills ───────────────────────────────────────────────────────────────────
# Every profile reads the canonical skills tree, so a new or fixed skill reaches
# all of them without being copied per profile. Why this matters: profile skills
# dirs are materialised copies that SHADOW the canonical one, and they do drift
# silently — the orchestrator's copy of claude-design had grown an extra,
# task-specific line ('ensure ... Portuguese localization') added by an agent
# during a slide task, which would have leaked into every later deck.
#
# Note this is a no-op on the default home (its skills dir IS this path); it is
# the profiles that need it. Keep it set on all homes so the applier stays
# uniform and `--check` stays green.
SKILLS_EXTERNAL_DIRS="[~/.hermes/skills]"

# ── Profiles the applier writes to ───────────────────────────────────────────
# `default` is the main ~/.hermes/config.yaml; the rest are ~/.hermes/profiles/<n>/.
FLEET_PROFILES=(orchestrator dev research designer bookkeeper architect)
