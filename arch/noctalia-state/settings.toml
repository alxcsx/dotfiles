# Generated by noctalia-sync pull — edit via the noctalia UI and pull,
# or push to apply base + host override to the live file.
config_version = 15

[accessibility]
ui_scale = 1.0500000081956387

[bar.default]
background_opacity = 0.0
capsule_radius = 3
center = [ "group:g1" ]
concave_edge_corners = false
end = [ "group:g2" ]
font_family = "JetBrains Mono SemiBold"
margin_ends = 0
radius = 0
scale = 1.2500000111758709
start = [ "group:g3" ]
thickness = 38
widget_spacing = 12

    [[bar.default.capsule_group]]
    border = ""
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "control-center", "clock", "media" ]
    opacity = 1.0
    padding = 10.0

    [[bar.default.capsule_group]]
    border = ""
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "keyboard_layout",
        "battery",
        "session"
    ]
    opacity = 1.0
    padding = 10.0

    [[bar.default.capsule_group]]
    border = ""
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "launcher", "wallpaper", "workspaces" ]
    opacity = 1.0
    padding = 6.0
    radius = 3.0

[control_center]
sidebar = "full"
sidebar_section = "full"
width = 800

[location]
auto_locate = true

[shell]
clipboard_keep_from_closed_apps = false
corner_radius_scale = 0.5000000074505806
font_family = "JetBrains Mono Medium"
polkit_agent = true

    [shell.keyboard_layout.custom_labels]
    "English (US, intl., with dead keys)" = "US"
    "Portuguese (Brazil)" = "PT"

    [shell.launcher]
    categories = false
    compact = true
    show_icons = false

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true

[theme]
builtin = "Ayu"
community_palette = "Gruber Darker"
custom_palette = "1776911666279633-mo"
source = "community"
wallpaper_scheme = "m3-monochrome"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kitty", "qt", "starship" ]
    community_ids = [ "zen-browser", "discord", "telegram", "vscode", "steam", "bat" ]

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.control-center]
color = "hover"
glyph = "navigation"
scale = 1.1000000000000001

[widget.launcher]
enabled = false

[widget.media]
album_art_only = true
art_size = 20
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
capsule_padding = 10
show_label = false

[widget.tray]
detached_panel = true
drawer = true
drawer_columns = 1
drawer_item_size = 25.0
pinned = [ "tailscale" ]

[widget.volume]
show_label = false

[widget.wallpaper]
enabled = false

[widget.workspaces]
capsule = true
capsule_padding = 13
max_label_chars = 20
style = "minimal"